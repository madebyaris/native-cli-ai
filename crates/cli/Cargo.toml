[package]
name = "nca-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive TUI shell and CLI entrypoint for nca"

[[bin]]
name = "nca"
path = "src/main.rs"

[dependencies]
nca-autoresearch = { workspace = true }
nca-common = { workspace = true }
nca-core = { workspace = true }
nca-runtime = { workspace = true }
nca-tui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cli-prompts = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures = "0.3"
colored = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
similar = "2"

[dev-dependencies]
nca-runtime = { workspace = true }
tempfile = "3"
assert_cmd = "2"
insta = "1"
predicates = "3"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }

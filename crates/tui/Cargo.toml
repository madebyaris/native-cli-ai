[package]
name = "nca-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI (full-screen TUI + line-oriented REPL) for nca"

[dependencies]
nca-common = { workspace = true }
nca-core = { workspace = true }
nca-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
ratatui = "0.30"
crossterm = "0.29"
futures = "0.3"
reedline = "0.38"
syntect = "5"
pulldown-cmark = "0.12"
colored = "3"
similar = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
cli-prompts = { workspace = true }

[dev-dependencies]
tempfile = "3"
insta = "1"

[package]
name = "nca-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent loop, provider abstraction, tool protocol, and approval policy"

[lints]
workspace = true

[features]
default = []
# Enables the BM25 code-search tool (search_semantic). Off by default so the
# default `nca` binary avoids the ~2MB tantivy cost.
semantic-index = ["nca-index/semantic-index"]

[dependencies]
nca-common = { workspace = true }
nca-index = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
similar = "2"
globset = "0.4"
async-trait = "0.1"
base64 = "0.22"
scraper = "0.23"
futures-util = "0.3"
serde_yaml = "0.9.34"
mcpr = "0.2.3"
regex = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12.0"
tokio = { workspace = true, features = ["test-util"] }
insta = { version = "1", features = ["json"] }

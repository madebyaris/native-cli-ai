# cargo-deny configuration for nca
#
# Run `cargo deny check` locally (or let CI do it).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories: block known vulnerabilities / yanked crates.
# ---------------------------------------------------------------------------
[advisories]
version = 2
yanked = "warn"
ignore = [
  # 2026-05-22 — syntect 5.x pulls unmaintained yaml-rust 0.4.
  # Tracking: upgrade to syntect 6.x when released (target 2026-Q3).
  # Owner: TUI rendering stack (nca-tui).
  "RUSTSEC-2024-0320", # yaml-rust unmaintained
  # 2026-05-22 — syntect 5.x still depends on bincode 1.x.
  # Tracking: migrate with syntect 6.x (target 2026-Q3).
  "RUSTSEC-2025-0141", # bincode 1.x unmaintained
  # 2026-05-22 — scraper -> selectors -> fxhash (unmaintained, not vulnerable).
  # Tracking: monitor servo/selectors releases; no action until upstream migrates.
  "RUSTSEC-2025-0057", # fxhash unmaintained
]

# ---------------------------------------------------------------------------
# Licenses: only OSI-approved permissive / weak-copyleft licenses.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  # webpki-roots ships Mozilla's CA bundle under CDLA-Permissive-2.0.
  "CDLA-Permissive-2.0",
  # openssl / openssl-sys ship under the OpenSSL license; pulled in
  # transitively by mcpr -> reqwest default-tls (see bans below).
  "OpenSSL",
]
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ---------------------------------------------------------------------------
# Bans: disallow specific crates; tolerate duplicate versions for now.
# ---------------------------------------------------------------------------
[bans]
# Multiple versions exist transitively (reqwest 0.12/0.13, winnow 0.7/1.0).
# Keep visible via "warn" but don't fail CI until upstream resolves.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# NB: we cannot fully ban openssl today because mcpr 0.2 transitively pulls
# reqwest with native-tls. Our first-party crates use rustls-tls only.
# Revisit when mcpr exposes a TLS feature toggle.
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources: only crates.io is allowed by default.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

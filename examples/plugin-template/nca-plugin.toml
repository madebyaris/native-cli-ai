[plugin]
name = "example"
version = "0.1.0"
api_version = "1"
wasm = "plugin.wasm"
description = "Template: one small override per extension point"

[hooks]
auth = true
subagent = true
agent = true
cosmetic = true
login = true

[capabilities]
# Files and env are deny-by-default; network is allowed unless you set `network`. This template makes
# no HTTP requests, so it denies the network. It reads one env var.
network = []
env = ["EXAMPLE_API_KEY"]
# The login hook keeps its own token in the plugin data directory.
fs_write = ["$NCA_PLUGIN_DATA"]

[config]
prompt_suffix = "Answer in the style of a terse senior engineer."
blocked_command = "rm -rf /"
accent = "#f97316"
login_url = "https://example.com/login"
